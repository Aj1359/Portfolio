<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="100" height="100" fill="url(#grad)" rx="14"/>
  
  <!-- Rupee symbol -->
  <text x="50" y="50" font-size="48" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif">₹</text>
  
  <!-- Growth indicator (upward trend) -->
  <path d="M 70 65 Q 75 55 80 65" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
